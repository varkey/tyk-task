name: CI - Golang

on:
  push:
    branches: [main]
    paths:
      - 'golang/**'
      - '.github/workflows/ci-golang.yml'
  pull_request:
    paths:
      - 'golang/**'
      - '.github/workflows/ci-golang.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: golang
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: golang/go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -cover

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: golang/go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: golang
          # install-mode defaults to "binary" (the officially recommended
          # mode - golangci-lint's own docs advise against "goinstall").
          #
          # Pinned rather than "latest" so a new golangci-lint release can't
          # silently start failing this job (new/stricter lint rules, or -
          # what broke this job before on the stale v6 action - a release
          # built with an older Go toolchain than this module's `go`
          # directive). Verified: v2.12.2 is built with go1.26.2 and lints
          # this module clean. Bump deliberately, alongside `go.mod`'s `go`
          # directive when that moves.
          version: v2.12.2

  # Builds the container image on every push/PR (catches a broken Dockerfile
  # before merge) for both amd64 and arm64, on native runners for each arch.
  # Pushes to GHCR by digest only for pushes to main; the "merge-image" job
  # below then combines the per-arch digests into one multi-arch manifest -
  # satisfies "build into a container image when I push a commit to main".
  build-image:
    name: Build image (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Lowercase image repository (GHCR requires lowercase)
        run: echo "IMAGE_REPO=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_REPO }}

      - uses: docker/login-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        if: "!(github.event_name == 'push' && github.ref == 'refs/heads/main')"
        uses: docker/build-push-action@v7
        with:
          context: golang
          platforms: ${{ matrix.platform }}
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Build and push by digest
        id: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: golang
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_REPO }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          retention-days: 1

  merge-image:
    name: Merge image manifest
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lowercase image repository (GHCR requires lowercase)
        run: echo "IMAGE_REPO=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_REPO }}@sha256:%s ' *)

  # Removes old untagged/superseded image versions from GHCR so the package
  # doesn't grow unbounded - keeps the last 10 tagged sha versions plus
  # anything tagged "latest".
  cleanup:
    name: Cleanup old packages
    runs-on: ubuntu-latest
    needs: merge-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
    steps:
      - name: Cleanup old images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          exclude-tags: ^(latest|\d+\.\d+.*)$
          use-regex: true
          keep-n-tagged: 10
          delete-untagged: true
          delete-ghost-images: true
          validate: true
